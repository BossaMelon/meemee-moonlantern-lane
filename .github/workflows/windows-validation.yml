name: Windows source validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-source:
    name: windows-source
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      W01_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, resolved from official tag
        with:
          python-version: "3.14.6"
          architecture: x64
      - name: Exercise guard fixtures
        shell: pwsh
        run: |
          & ./tools/run_windows_gate.ps1 -SelfTest -ReportDirectory "$env:RUNNER_TEMP/w01-selftest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual Windows source suites
        shell: pwsh
        run: |
          & ./tools/run_windows_gate.ps1 -ReportDirectory "$env:RUNNER_TEMP/w01-source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve whitelisted diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-source-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/w01-selftest/summary.json
            ${{ runner.temp }}/w01-selftest/executions.json
            ${{ runner.temp }}/w01-selftest/*-stdout.log
            ${{ runner.temp }}/w01-selftest/*-stderr.log
            ${{ runner.temp }}/w01-selftest/*-engine.log
            ${{ runner.temp }}/w01-source/summary.json
            ${{ runner.temp }}/w01-source/executions.json
            ${{ runner.temp }}/w01-source/source-before.json
            ${{ runner.temp }}/w01-source/source-after.json
            ${{ runner.temp }}/w01-source/gate-report.json
            ${{ runner.temp }}/w01-source/*-stdout.log
            ${{ runner.temp }}/w01-source/*-stderr.log
            ${{ runner.temp }}/w01-source/import-engine.log
            ${{ runner.temp }}/w01-source/quality-diagnostic-engine.log
            ${{ runner.temp }}/w01-source/quality-diagnostic-cases.json
